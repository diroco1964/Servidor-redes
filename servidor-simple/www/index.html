<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejemplo de Página HTML</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Bienvenido a mi página web</h1>
    </header>
    <main>
        <p>Este es un ejemplo de una página HTML con CSS y JavaScript incluidos.</p>
        <img src="imagen.png" alt="Descripción de la imagen">
        <button id="myButton">Haz clic aquí</button>

        <!-- Prueba requisito 7: GET con parámetros en la URL (/?buscar=...) -->
        <h2>Prueba GET</h2>
        <form method="get" action="/">
            <input name="buscar" placeholder="Buscar">
            <button type="submit">Enviar por GET</button>
        </form>

        <!-- Prueba requisito 6: POST, los datos viajan en el cuerpo -->
        <h2>Prueba POST</h2>
        <form id="formPost" method="post" action="/">
            <input name="nombre" placeholder="Tu nombre">
            <button type="submit">Enviar por POST</button>
        </form>
    </main>
    <dialog id="modalRecibido">
        <h2 id="modalTitulo">Datos recibidos</h2>
        <p id="modalMensaje"></p>
        <button type="button" id="modalCerrar">Cerrar</button>
    </dialog>

    <script src="script.js"></script>
</body>
</html>
